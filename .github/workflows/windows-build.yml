name: Windows build
on:
  push:
    branches: [main, feat/windows-hse-mvp]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Ergonomy/Ergonomy.csproj
      - name: Build
        run: dotnet build src/Ergonomy/Ergonomy.csproj -c Release --no-restore
      - name: Publish standalone Windows x64
        run: dotnet publish src/Ergonomy/Ergonomy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release/Ergonomy-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Ergonomy-win-x64
          path: release/Ergonomy-win-x64/
          if-no-files-found: error
