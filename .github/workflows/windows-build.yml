name: Windows glass dock build
on:
  push:
    branches: [main, feat/windows-hse-mvp, feat/glass-dock-v2]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/Ergonomy/Ergonomy.csproj
      - name: Compile WPF dock
        run: dotnet build src/Ergonomy/Ergonomy.csproj -c Release --no-restore
      - name: Publish self-contained exe
        run: dotnet publish src/Ergonomy/Ergonomy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release/Ergonomy-win-x64
      - name: Headless startup self-test
        shell: pwsh
        run: |
          & ".\release\Ergonomy-win-x64\Ergonomy.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Ergonomy self-test returned exit code $LASTEXITCODE" }
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: Ergonomy-GlassDock-v2-Windows-x64
          path: release/Ergonomy-win-x64/
          if-no-files-found: error
